<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DCA Engine</title>
  <style>
    :root {
      --theme-color: #0ecb81;
      --theme-bg: rgba(14, 203, 129, 0.08);
    }
    body.short-mode {
      --theme-color: #f6465d;
      --theme-bg: rgba(246, 70, 93, 0.08);
    }
    body { background: #0b0e11; color: #eaecef; font-family: Arial, sans-serif; padding: 15px; margin: 0; transition: 0.3s; }
    .box { max-width: 900px; margin: auto; }
    h2 { color: var(--theme-color); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    .badge { font-size: 12px; padding: 4px 10px; border-radius: 4px; background: var(--theme-bg); border: 1px solid var(--theme-color); color: var(--theme-color); }
    .inputs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; background: #181a20; padding: 15px; border-radius: 8px; border: 1px solid var(--theme-color); transition: 0.3s; }
    label { font-size: 12px; color: #848e9c; display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 8px; background: #2b3139; color: #fff; border: 1px solid #474d57; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
    input:focus, select:focus { outline: none; border-color: var(--theme-color); }
    button { grid-column: span 2; padding: 12px; background: var(--theme-color); color: #000; font-weight: bold; border: none; border-radius: 5px; font-size: 15px; cursor: pointer; margin-top: 5px; transition: 0.2s; }
    button:hover { opacity: 0.9; }
    .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 15px 0; }
    .card { background: #181a20; padding: 12px; border-radius: 8px; border: 1px solid #2b3139; }
    .card small { color: #848e9c; display: block; font-size: 11px; }
    .card b { font-size: 16px; }
    .hint { font-size: 11px; color: #848e9c; margin-bottom: 6px; text-align: right; }
    .table-box { overflow-x: auto; background: #181a20; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: right; }
    th, td { padding: 10px; border-bottom: 1px solid #2b3139; white-space: nowrap; }
    th { background: #1e2329; color: #848e9c; }
    td:first-child, th:first-child { text-align: center; }
    .copyable { cursor: pointer; border-radius: 4px; transition: 0.15s; }
    .copyable:hover { background: #2b3139; }
    .green { color: #0ecb81; }
    .red { color: #f6465d; }
    .yellow { color: #f0b90b; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #f0b90b; color: #000; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: bold; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 999; }
    #toast.show { opacity: 1; bottom: 30px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>
      <span>⚡ DCA Engine</span>
      <span class="badge" id="modeBadge">LONG MODE</span>
    </h2>
    <div class="inputs">
      <div>
        <label>Direction</label>
        <select id="side" onchange="updateTheme(); runCalc();">
          <option value="LONG">LONG</option>
          <option value="SHORT">SHORT</option>
        </select>
      </div>
      <div>
        <label>Entry Price ($)</label>
        <input type="number" id="entry" value="150" step="any">
      </div>
      <div>
        <label>Leverage (x)</label>
        <input type="number" id="lev" value="40">
      </div>
      <div>
        <label>First Margin ($)</label>
        <input type="number" id="m1" value="6" step="any">
      </div>
      <div>
        <label>Multiplier (x)</label>
        <input type="number" id="mult" value="1.5" step="any">
      </div>
      <div>
        <label>DCA Trigger Drop (%)</label>
        <input type="number" id="roiDrop" value="48" step="any">
      </div>
      <div>
        <label>Total Orders</label>
        <input type="number" id="orders" value="6">
      </div>
      <div>
        <label>Target Profit (%)</label>
        <input type="number" id="tpPct" value="100" step="any">
      </div>
      <button type="button" onclick="runCalc()">Calculate Now</button>
    </div>

    <div class="cards" id="cards"></div>

    <div class="hint">💡 Click any price in the table to copy</div>
    <div class="table-box">
      <table>
        <thead>
          <tr>
            <th>Order</th>
            <th>Trigger ($)</th>
            <th>Margin ($)</th>
            <th>Total Margin ($)</th>
            <th>Avg Entry ($)</th>
            <th id="tpHeader">100% Profit ($)</th>
            <th>Est. Liq ($)</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="toast">Copied!</div>

  <script>
    function f(n) {
      if (n >= 1000) return n.toFixed(2);
      if (n >= 1) return n.toFixed(4);
      return n.toFixed(6);
    }

    function updateTheme() {
      var side = document.getElementById("side").value;
      var badge = document.getElementById("modeBadge");
      if (side === "SHORT") {
        document.body.classList.add("short-mode");
        badge.innerText = "SHORT MODE";
      } else {
        document.body.classList.remove("short-mode");
        badge.innerText = "LONG MODE";
      }
    }

    function copyVal(val) {
      navigator.clipboard.writeText(val);
      var toast = document.getElementById("toast");
      toast.innerText = "Copied: " + val;
      toast.classList.add("show");
      setTimeout(function() {
        toast.classList.remove("show");
      }, 1500);
    }

    function runCalc() {
      var side = document.getElementById("side").value;
      var entry = parseFloat(document.getElementById("entry").value);
      var lev = parseFloat(document.getElementById("lev").value);
      var m1 = parseFloat(document.getElementById("m1").value);
      var mult = parseFloat(document.getElementById("mult").value);
      var roiDrop = parseFloat(document.getElementById("roiDrop").value);
      var orders = parseInt(document.getElementById("orders").value);
      var tpInput = parseFloat(document.getElementById("tpPct").value) || 100;

      if (!entry || !lev || !m1 || !mult || !orders || orders < 1) return;

      document.getElementById("tpHeader").innerText = tpInput + "% Profit ($)";

      var step = (roiDrop / 100) / lev;
      var tpRatio = (tpInput / 100) / lev;
      var liq = 0.8 / lev;
      var totM = 0, totPos = 0, totCoins = 0, avg = entry;
      var rows = "";

      for (var i = 1; i <= orders; i++) {
        var trig = (i === 1) ? entry : (side === "LONG" ? avg * (1 - step) : avg * (1 + step));
        var om = m1 * Math.pow(mult, i - 1);
        var opos = om * lev;
        var ocoins = opos / trig;

        totM += om;
        totPos += opos;
        totCoins += ocoins;
        avg = totPos / totCoins;

        var tpPrice = (side === "LONG") ? avg * (1 + tpRatio) : avg * (1 - tpRatio);
        var eliq = (side === "LONG") ? avg * (1 - liq) : avg * (1 + liq);

        var trigStr = f(trig);
        var avgStr = f(avg);
        var tpStr = f(tpPrice);

        rows += "<tr>" +
          "<td><b>#" + i + "</b></td>" +
          "<td class='copyable' onclick=\"copyVal('" + trigStr + "')\">$" + trigStr + "</td>" +
          "<td>$" + om.toFixed(2) + "</td>" +
          "<td>$" + totM.toFixed(2) + "</td>" +
          "<td class='yellow copyable' onclick=\"copyVal('" + avgStr + "')\"><b>$" + avgStr + "</b></td>" +
          "<td class='green copyable' onclick=\"copyVal('" + tpStr + "')\">$" + tpStr + "</td>" +
          "<td class='red'>$" + f(eliq) + "</td>" +
        "</tr>";
      }

      var slPct = 0.50 / lev;
      var hardSL = (side === "LONG") ? avg * (1 - slPct) : avg * (1 + slPct);
      var lossAmt = totM * 0.50;

      var cardsHTML = "<div class='card'><small>Total Capital Needed</small><b class='yellow'>$" + totM.toFixed(2) + "</b></div>" +
        "<div class='card'><small>Hard Stop Loss (-50% ROI)</small><b class='red copyable' onclick=\"copyVal('" + f(hardSL) + "')\">$" + f(hardSL) + "</b></div>" +
        "<div class='card'><small>Max Loss at Hard SL</small><b class='red'>-$" + lossAmt.toFixed(2) + "</b></div>" +
        "<div class='card'><small>Safe Capital Saved</small><b class='green'>$" + (totM - lossAmt).toFixed(2) + "</b></div>";

      document.getElementById("tbody").innerHTML = rows;
      document.getElementById("cards").innerHTML = cardsHTML;

      var savedData = {
        side: side, entry: entry, lev: lev, m1: m1, mult: mult,
        roiDrop: roiDrop, orders: orders, tpInput: tpInput, rows: rows, cardsHTML: cardsHTML
      };
      localStorage.setItem("dca_engine_v2", JSON.stringify(savedData));
    }

    window.onload = function() {
      var saved = localStorage.getItem("dca_engine_v2");
      if (saved) {
        var data = JSON.parse(saved);
        document.getElementById("side").value = data.side;
        document.getElementById("entry").value = data.entry;
        document.getElementById("lev").value = data.lev;
        document.getElementById("m1").value = data.m1;
        document.getElementById("mult").value = data.mult;
        document.getElementById("roiDrop").value = data.roiDrop;
        document.getElementById("orders").value = data.orders;
        document.getElementById("tpPct").value = data.tpInput || 100;
        updateTheme();
        document.getElementById("tpHeader").innerText = (data.tpInput || 100) + "% Profit ($)";
        document.getElementById("tbody").innerHTML = data.rows;
        document.getElementById("cards").innerHTML = data.cardsHTML;
      } else {
        updateTheme();
        runCalc();
      }
    };
  </script>
</body>
</html>
